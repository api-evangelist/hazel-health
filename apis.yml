aid: hazel-health
name: Hazel Health
description: 'Hazel Health is the nation''s leading provider of school-based telehealth, delivering virtual
  physical and mental health care to K-12 students. Founded in 2015 and headquartered in San Francisco,
  California, Hazel partners directly with school districts and families to connect students with licensed,
  linguistically and culturally diverse clinicians and therapists — at school or at home — often within
  minutes for medical care and within days for teletherapy, at no cost to families. The company serves
  more than two million students across 100-plus districts nationwide, helping reduce chronic absenteeism
  and address gaps in access to care as an extension of the school health team. Hazel operates HIPAA- and
  FERPA-compliant systems with full encryption and secure access controls. It is a B2B/B2G healthcare
  provider and does not currently publish a public developer API, SDK, or developer portal.'
